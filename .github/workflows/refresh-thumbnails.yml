name: Build HD portfolio thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'asset-upload/READY.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild original project thumbnails
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/work-final
          for name in roze-remit boat-app d-transfer scentri working-live; do
            echo "Rebuilding $name"
            cat asset-upload/$name/chunk*.txt | base64 -d > assets/work-final/$name.webp
            bytes=$(wc -c < assets/work-final/$name.webp)
            echo "$name bytes: $bytes"
            python3 - "$name" <<'PY'
import sys
from pathlib import Path
name=sys.argv[1]
p=Path('assets/work-final')/(name+'.webp')
b=p.read_bytes()
if len(b) < 40000 or b[:4] != b'RIFF' or b[8:12] != b'WEBP':
    raise SystemExit(f'Invalid WebP: {p} ({len(b)} bytes)')
print(f'validated {p}: {len(b)} bytes')
PY
          done

      - name: Point portfolio to HD originals
        shell: bash
        run: |
          python3 - <<'PY'
from pathlib import Path
import re
p=Path('index.html')
s=p.read_text(encoding='utf-8')
for name in ['roze-remit','boat-app','d-transfer','scentri','working-live']:
    s=re.sub(rf'assets/(?:work|work-hd|work-final)/{re.escape(name)}\.(?:jpg|jpeg|png|webp)(?:\?v=[^"\s>]*)?', f'assets/work-final/{name}.webp?v=hd-original-1', s)
p.write_text(s,encoding='utf-8')
PY

      - name: Commit verified HD thumbnails
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/work-final index.html
          git commit -m "Use original HD project thumbnails"
          git push
