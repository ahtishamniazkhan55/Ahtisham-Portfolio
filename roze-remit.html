<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Roze Remit website redesign case study by Ahtisham Niaz.">
<title>Roze Remit — Ahtisham Niaz</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff;color:#0a0a0a}
  body{overflow-x:hidden}
  .case-study{width:100%;background:#fff}
  .page{width:100%;display:flex;justify-content:center;align-items:flex-start;line-height:0;background:#fff}
  .page canvas{display:block;width:100%;height:auto;background:#fff}
  .loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fff;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#666}
  .loading[hidden]{display:none}
  .error{min-height:100vh;display:grid;place-items:center;padding:32px;font-family:Arial,Helvetica,sans-serif;color:#555;text-align:center;line-height:1.5}
  @media(min-width:1921px){.case-study{max-width:1920px;margin:0 auto}}
</style>
</head>
<body>
<div class="loading" id="loading">Loading case study…</div>
<main class="case-study" id="caseStudy" aria-label="Roze Remit case study"></main>
<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';

const root=document.getElementById('caseStudy');
const loading=document.getElementById('loading');
let pdfDoc=null;
let renderToken=0;

function safeOutputScale(viewport){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const maxPixels=22000000;
  const area=Math.max(1,viewport.width*viewport.height);
  const memorySafe=Math.sqrt(maxPixels/area);
  return Math.max(1,Math.min(dpr,memorySafe));
}

async function renderAll(){
  if(!pdfDoc) return;
  const token=++renderToken;
  const width=Math.min(window.innerWidth,1920);
  const frag=document.createDocumentFragment();

  for(let i=1;i<=pdfDoc.numPages;i++){
    if(token!==renderToken) return;
    const page=await pdfDoc.getPage(i);
    const base=page.getViewport({scale:1});
    const scale=width/base.width;
    const viewport=page.getViewport({scale});
    const outputScale=safeOutputScale(viewport);

    const wrap=document.createElement('section');
    wrap.className='page';
    wrap.setAttribute('aria-label',`Roze Remit case study page ${i}`);

    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d',{alpha:false});
    canvas.width=Math.max(1,Math.floor(viewport.width*outputScale));
    canvas.height=Math.max(1,Math.floor(viewport.height*outputScale));
    canvas.style.width=`${Math.floor(viewport.width)}px`;
    canvas.style.height=`${Math.floor(viewport.height)}px`;
    wrap.appendChild(canvas);
    frag.appendChild(wrap);

    const transform=outputScale===1?null:[outputScale,0,0,outputScale,0,0];
    await page.render({canvasContext:ctx,viewport,transform}).promise;
  }

  if(token!==renderToken) return;
  root.replaceChildren(frag);
  loading.hidden=true;
}

async function init(){
  try{
    pdfDoc=await pdfjsLib.getDocument({
      url:'Roze-Remit-Portfolio.pdf?v=20260923-case2',
      disableAutoFetch:false,
      disableStream:false
    }).promise;
    await renderAll();
  }catch(error){
    console.error(error);
    loading.hidden=true;
    root.innerHTML='<div class="error">The Roze Remit case study could not be loaded.</div>';
  }
}

let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(renderAll,220);
});

init();
</script>
</body>
</html>
